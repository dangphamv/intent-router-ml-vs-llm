[project]
name = "intent-router"
version = "0.1.0"
description = "Intent classification for customer messages: classical ML on embeddings vs LLM, plus a confidence-based hybrid router."
readme = "README.md"
authors = [
    { name = "dangphamv", email = "phamdang.khtn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]
